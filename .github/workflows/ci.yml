name: ci

# Runs once per pull request. `test` is a required check on main (with `interaction`
# from browser.yml), and main only moves by a PR that is up to date with it, so a merge
# lands exactly the tree that was tested; pushes to main do not re-run the suite.
# No docs-only skip here, unlike browser.yml: the unit suite reads README.md (freshness),
# CHANGELOG.md (version) and every tracked text file (test_privacy, test_no_merge_markers),
# so a README edit is exactly what this job must check (.github/docs-only.sh says more).
on:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    # Pinned, not ubuntu-latest: the label moved to Ubuntu 26.04 in October 2026; move
    # this on purpose, together with browser.yml.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install -e ".[dev]"
      - name: Cross-platform manifest drift check
        # --check: 8 manifests + CHANGELOG top must agree.
        # --audit: a stray undeclared version string (a missed manifest) fails.
        run: |
          python scripts/bump_version.py --check
          python scripts/bump_version.py --audit
      - name: Run full test suite
        # Hermetic: geocode mocked. Covers schema, gates, e2e fixtures, README
        # freshness, version consistency, and the cross-platform manifest gates.
        run: python -m pytest -q
