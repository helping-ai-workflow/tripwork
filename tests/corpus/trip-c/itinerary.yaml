contingency:
- trigger: 颱風/大雨
  fallback: 戶外（故宮南院園區水景、板陶窯）改室內：南院常設展廳、花磚、美術館（週日）、檜意店鋪；D2 番路山區雨天視線差，清豐濤月改期或改市區餐廳（蔡氏鴨庄）。
- trigger: 阿宏師撲空/公休
  note: 來源標週一二休
  fallback: 改噴水雞肉飯小雅旗艦店（附停車）或其他在地雞肉飯。
- trigger: 源興御香屋大排長龍
  fallback: 先電話預訂外帶（05-2238289），或改其他嘉義飲品；勿因排隊擠壓新營出發時間。
- trigger: 喬串燒酒場訂位有變/當天客滿或臨時休息
  note: 已訂位；店家電話 06-632-0031，週三公休、8/29 週六正常營業
  fallback: 新營已驗證備案：山寨家庭餐廳（合菜、公休週四、需訂位 06-6566777）或阿添鵝肉（06-6356920）；兩家皆近新營交流道好停車。
- trigger: 清豐濤月假日不接受訂位/客滿或休
  fallback: 市區備案蔡氏鴨庄（炭烤鴨一鴨三吃，行前電話確認）。
- trigger: 故宮南院太熱/看不完
  fallback: 常設展重點看亞洲織品、佛教藝術、亞洲茶文化廳；園區水景傍晚較涼。
- trigger: 板陶窯不做 DIY
  fallback: 純逛園區交趾陶＋貓咪車站，順逛新港市區小吃（新港飴、金桔）。
- trigger: D3 想多留嘉義
  fallback: 檜意森活村旁可加嘉義製材所/森林之歌（戶外）；美術館週一休不排。時間夠再北返、避免趕路。
