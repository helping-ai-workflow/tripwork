title: 嘉義 3 天 2 夜自駕（2026/08/29–31）｜故宮南院·花磚·雞肉飯＋新營晚餐聚會
must_do_coverage:
  參觀國立故宮博物院南部院區（故宮南院）:
  - npm-southern-branch
  參觀台灣花磚博物館:
  - hua-ching-tile-museum
  品嘗道地嘉義火雞肉飯（和平 + 阿宏師 各一天午餐）:
  - heping-turkey-rice
  - a-hong-shi-turkey-rice
checklist:
- 訂房｜示品酒店嘉義（西區噴水圓環旁、免費停車、15:00 可 check-in）；2 晚 1 房，官網/訂房平台實查 8/29–31 房價與含早方案。
- D1 新營晚餐｜已訂喬串燒酒場（已訂位）：台南市新營區復興路144-5號、06-632-0031、18:00 開門、週三公休（8/29 週六有開）。店家為師傅一人作業、出餐較慢，確認訂位時間與人數；駕駛勿飲酒。
- D2 晚餐｜清豐濤月景觀餐廳（番路凸湖、湖景火鍋+足湯）低消每人150、收客20:00；假日（週日）不接受訂位、現場候位 → 建議 18:00 前到；番路為山區、夜間下山小心行車。
- 行前保險｜出發前一週電話確認每家餐廳「當天營業」＋可否訂位（餐廳說關就關，網路資料會落後）：清豐濤月 05-2593133、阿宏師、和平、新港鴨肉羹等。
- 週一(8/31) 休館提醒｜故宮南院、嘉義市立美術館、源興御香屋、劉里長雞肉飯 週一皆休，故宮南院已排週日、御香屋排週六；D3 只安排週一有開的檜意森活村＋和平火雞肉飯。
- 阿宏師火雞肉飯｜有來源標公休週一、二，故排 8/29 週六午餐；出發前可再電話確認。
- 故宮南院｜週末 09:00–18:00（末入場約 17:30）；全票 150，未滿18/65歲以上/本國學生免費，嘉義縣市居民 15:00 後免費（帶證件）。
- 花磚博物館｜週三–週一 10:00–17:30（末入場 17:00）、公休週二；門票 100 含 50 元折抵；假日現場人數控管、可能排隊。
- 板陶窯｜09:30–17:00、需購票（約100，另有含DIY下午茶套票約468）；末入園約16:30。
- 高溫｜8 月底日間 32–36°C 濕熱，避正午久曬、多補水；室內點（南院/花磚/美術館/檜意店鋪）避熱，戶外（板陶窯/南院園區）排上午。
- 午後雷陣雨｜約 13:00–17:00，戶外盡量排上午、隨身輕便雨具；自駕注意積水與能見度。
- 颱風季｜行前 1–2 天查中央氣象署颱風消息；若發陸上警報，國道風雨大、戶外/新營聚餐需彈性調整。
- 夜駕（D1）｜嘉義↔新營往返（日落約 18:15 後夜返），注意夜間疲勞與照明；駕駛聚餐勿飲酒。
- 國道車潮｜D1 8/29 週六出發地南下 10:00 出發、約 13:10 抵嘉義；D3 8/31 週一午後北返、避開週日北返尖峰相對順。可帶悠遊卡/一卡通供停車/超商。
- 費用｜全程約 NT$12,700（住宿 5,000＋交通約 2,500＋餐飲門票雜支約 5,200，2 人 3 天粗估；估算非報價，as_of 2026-08-07）。
days:
- date: '2026-08-29'
  label: 週六·出發地出發 → 嘉義（花磚·阿宏師雞肉飯）→ 傍晚台南新營晚餐聚會（喬串燒酒場·已訂位）
  lodging: hotel-c1
  rows:
  - time: '10:00'
    slot: move
    from: 出發地
    to: 示品酒店嘉義
    text: 自駕國道1號南下約 190 分（~230km），約 13:10 抵嘉義；週六車潮，沿途停服務區小休。
  - time: '13:15'
    slot: meal
    poi_id: a-hong-shi-turkey-rice
    text: 抵嘉義先吃午餐：阿宏師火雞肉飯（光華總店），在地排隊名店、Google 8 千則以上評價；營業至 20:00，過午時段人潮較緩。
    closing_status: ok
  - time: '14:15'
    slot: visit
    poi_id: hua-ching-tile-museum
    text: 台灣花磚博物館（西區林森西路，近飯店），百年老屋花磚藝術、室內冷氣避午熱；散客免預約、假日現場人數控管，門票 100 含 50 折抵。閉館 17:00，抓 1 小時。
    closing_status: ok
  - time: '15:45'
    slot: lodging
    poi_id: hotel-c1
    text: 示品酒店 check-in、放行李、稍作休息（15:00 起入住、免費停車）。
  - time: '16:30'
    slot: activity
    poi_id: yuxing-yuxiangwu
    text: 順道買源興御香屋招牌葡萄柚綠茶（週一公休、故排今天），嘉義限定、常大排長龍，可先電話預訂外帶 05-2238289。
    closing_status: ok
  - time: '17:30'
    slot: move
    from: 示品酒店嘉義
    to: 喬串燒酒場
    text: 開車南下台南新營（國道1號約 40 分）會合；店在復興路144-5號，近新營交流道，路邊停車。
  - time: '18:30'
    slot: meal
    poi_id: qiao-yakitori
    text: 新營晚餐聚會：喬串燒酒場（日式串燒居酒屋，已訂位），18:00 開門、4.8★；師傅一人作業出餐較慢，抓 2 小時從容吃。順道帶今天買的源興御香屋葡萄柚綠茶當伴手禮。駕駛勿飲酒，回程由未飲酒者開車或叫車。
    closing_status: ok
  - time: '20:30'
    slot: move
    from: 喬串燒酒場
    to: 示品酒店嘉義
    text: 餐後夜間國道1號北返嘉義（日落約 18:15、夜駕注意照明與疲勞；駕駛勿飲酒）。
- date: '2026-08-30'
  label: 週日·故宮南院 ＋ 新港（鴨肉羹·板陶窯）＋ 番路清豐濤月湖景足湯晚餐
