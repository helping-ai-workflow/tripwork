    poi_id: qingfeng-taoyue
    text: 晚餐：清豐濤月景觀餐廳（番路凸湖，湖景火鍋＋養生足湯＋七彩琉璃光，情侶約會浪漫）；低消每人 150 含足湯與火鍋、收客至 20:00。假日不接受訂位、採現場候位，建議早到；出發前電話確認營業 05-2593133。備案：市區蔡氏鴨庄（桃城古味 Places 顯示暫停營業，暫勿列）。
