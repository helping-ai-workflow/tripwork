title: 日月潭 3天2夜 自駕避暑親子家庭遊（4 大人含長輩）
checklist:
- 訂房：D2 日月潭示淶閣飯店 2 房（水社碼頭第一排湖景，旺季週末請儘早訂；官網 https://www.dellago.com.tw/）
- D1 示麗溫德姆已訂，確認 2 房、入住15:00/退房11:00、房內美人湯泉
- 日月潭纜車：2026/6/1 起全票420元、假日10:00-16:30；遊湖船一日券約300元/人、營運09:00-17:00（可現場購）
- 九族文化村（若改備案全日）建議線上購票；夏季戶外較熱，多補水、午後看室內表演
- 悠遊卡：纜車/遊湖船/台灣好行可刷；國道通行費與飯店停車另備現金
- 7月酷熱：帽子/陽傘/防曬/水壺，正午11-15時避免長時間戶外
- 午後雷陣雨：戶外（遊湖/纜車）排上午、備輕便雨具；雷雨或強風遊湖船與纜車可能臨時停駛
- 颱風季：行前1-2天查中央氣象署颱風消息，若有警報船/纜車停駛需彈性改室內
- 自駕：天黑前（日落約18:35）上高速；國道3/6號夜間山路注意疲勞，回程下午即啟程
- Cona's妮娜巧克力城堡每週三公休（行程為週六不受影響）；門票全票220/優待160元
- D1 示麗為一泊二食（含晚餐＋早餐），D1 晚餐安排於飯店、不另訂外食
- D3 終點為出發地，之後同行成員接手開車載成員走國1/3回程（約1小時）
- D3 午餐在埔里真餐廳（台灣惠蓀咖啡品牌館，森林系景觀、近國6愛蘭交流道），不在高速公路服務區用餐；服務區僅如廁小休
- 所有用餐點 Google businessStatus 皆確認 OPERATIONAL（營業中）；惠蓀為森林系大窗，午餐到店請指定「2樓室內冷氣座位」
- 餐廳冷氣全部具備；土角厝請指定「玻璃屋區」（有冷氣）、新山味僅收現金且加一成清潔費
must_do_coverage:
  日月潭遊湖賞景（湖區為此行核心，因景色而續住）:
  - sights-4
  - sights-5
  - sights-7
  - sights-3
days:
- date: '2026-07-18'
  label: D1 7/18(六) 出發地出發 → 接人地點接成員 → 埔里順遊 → 日月潭(伊達邵)
  lodging: shili
  rows:
  - time: 09:00
    slot: move
    from: 出發地
    to: 接人地點
    text: 從出發地出發往接人地點接成員，含上車與行李約30分鐘
  - time: 09:30
    slot: move
    from: 接人地點
    to: 埔里
    text: 接到長輩即南下，國道3號→國道6號愛蘭交流道，約2.5小時。上午出發避午後雷陣雨
  - time: '11:00'
    slot: visit
    poi_id: service_area-2
    text: 途中如廁小休、補咖啡（石虎主題服務區）
  - time: '12:30'
    slot: meal
    poi_id: puli-tujiaocuo
    text: 桃米村客家合菜·水上玻璃屋庭園（訂玻璃屋區有冷氣）、免費停車場、可餵魚。最後點餐13:30，晚到仍有約1小時餘裕
  - time: '14:00'
    slot: visit
    poi_id: puli-conas
    text: 全室內冷氣巧克力夢想城堡：城堡造型好拍、巧克力DIY／義式冰淇淋／變裝拍照，非宗教、避正午高溫與雷雨（每週三公休，當天週六開）
  - time: '15:30'
    slot: move
    from: 埔里
    to: 日月潭（伊達邵）
    text: 台21線經魚池往日月潭，約40分鐘
  - time: '16:20'
    slot: lodging
    poi_id: shili
    text: 入住，房內美人湯泉稍歇（位伊達邵碼頭旁）
  - time: '17:20'
    slot: visit
    poi_id: sights-4
    text: 黃昏較涼，逛邵族老街、嚐小吃（山豬肉香腸、小米麻糬）
  - time: '18:30'
    slot: meal
    poi_id: shili
    text: 示麗一泊二食晚餐（飯店內，免再外出；當晚住房含美人湯泉）
- date: '2026-07-19'
  label: D2 7/19(日) 日月潭深度避暑：上午遊湖+纜車、午後室內 → 換宿水社
  lodging: d2-2
  rows:
  - time: '10:00'
    slot: activity
    text: 示麗 10:00 起床、悠閒早餐（飯店早餐供應至 12:00）
  - time: '11:00'
    slot: activity
    text: 退房、行李上車（上午先在伊達邵活動，車停伊達邵）
  - time: '11:15'
    slot: activity
    poi_id: sights-7
    text: 搭纜車來回看全潭（假日10:00-16:30），密閉車廂零步行零曝曬（伊達邵站）
  - time: '12:15'
    slot: activity
    poi_id: sights-4
    text: 搭遊湖船一日券，伊達邵↔玄光寺往返，船上遮蔭、湖風最涼、零步行
  - time: '12:35'
    slot: visit
    poi_id: sights-5
    text: 遊湖船中停玄光碼頭，短石階看拉魯島、配阿婆茶葉蛋，再搭船返伊達邵取車
  - time: '13:30'
    slot: move
    from: 日月潭（伊達邵）
    to: 日月潭（水社）
    text: 開車環湖到對岸水社，約15分鐘
  - time: '13:45'
    slot: meal
    poi_id: lunch-2
    text: 水社室內冷氣午餐，邵族風味合菜
  - time: '15:00'
    slot: visit
    poi_id: sights-2
    text: 午後避熱避雷雨：清水模建築大跨距遮蔭＋館內冷氣看日月潭影片（水社開車約5分）
  - time: '16:00'
    slot: lodging
    poi_id: d2-2
    text: 提早入住示淶閣（水社碼頭第一排180°湖景），飯店湖景大廳／陽台下午茶休息，避午後高溫（向山咖啡館已遷出，改飯店歇腳）
  - time: '17:30'
    slot: visit
    poi_id: sights-3
    text: 步行至水社碼頭親水步道散步、飯店陽台賞夕照（日落約18:35）
  - time: '18:30'
    slot: meal
    poi_id: lunch-3
    text: 水社晚餐：日月餐坊（中興停車場旁，室內合菜）
- date: '2026-07-20'
  label: D3 7/20(一) 水社晨景 → 埔里森林系景觀午餐 → 出發地（轉乘）
  rows:
  - time: '10:00'
    slot: activity
    text: 示淶閣 10:00 起床、悠閒早餐
  - time: '11:00'
    slot: activity
    poi_id: sights-3
    text: 退房；水社碼頭白天湖景散步
  - time: '11:15'
    slot: move
    from: 日月潭（水社）
    to: 埔里
    text: 台21線經魚池往埔里，約45分鐘（往國6愛蘭交流道方向）
  - time: '12:00'
    slot: meal
    poi_id: puli-huisun
    text: 埔里森林系景觀咖啡館午餐：牛肉麵／簡餐／手沖咖啡，2樓大窗遠眺群山、免費大停車場，緊鄰國6愛蘭交流道（午餐到店確認2樓冷氣座位）
  - time: '13:30'
    slot: move
    from: 埔里
    to: 出發地
    text: 國道6號→國道3號北上往出發地，約2.5小時
  - time: '14:45'
    slot: visit
    poi_id: service_area-2
    text: 途中如廁小休、伸展（不在此用餐）
  - time: '16:00'
    slot: activity
    text: 抵出發地，抵達出發地
  - time: '16:10'
    slot: move
    from: 出發地
    to: 接人地點
    text: 同行成員接手開車載成員回程：國道1或3號，約1小時
