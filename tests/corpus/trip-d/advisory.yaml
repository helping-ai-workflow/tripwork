items:
- topic: 中秋連假國道與北海岸台2 交通（自駕）
  rule: 國內自駕、無跨境／無航空 → 出入境、海關、鋰電池／行動電源隨身行李規範均不適用。 本行程改為 2 天 1 夜：9/24(四) 出發為連假前上班日、車流低；**9/25(五) 中秋當天回程**。 中秋連假國道疏運：依歷年措施，連假前段（9/25、9/26）上午國道1／國道5 南入匝道時段封閉、 後段（9/27、9/28）下午北入匝道封閉＋國5高乘載，連假期間 0–5 時暫停收費。 回程策略：9/25 午後上路、**走北海岸東段（福隆→金山）＋萬里接台62／國道3／國道1**， 刻意避開台2淡水海線午後觀光回堵與國5雪隧；金山北海岸為中秋一日遊熱點，午後最壅 → 早到金山、 15–16 時前離開北海岸上國道。⚠ 115 年(2026)官方專屬疏運措施行前才公布，出發前務必以 「高速公路1968」App／公路局即時資訊核對當日正式管制與路況。
  effective_date: '2026-09-25'
  risk: info
  sources:
