title: 東北角＋北海岸 2 天 1 夜自駕（正濱咖啡·灆咖啡龜山島·朱銘恆形展）
must_do_coverage:
  灆咖啡賞龜山島（吹冷氣、吃點心、看海景）:
  - lan-coffee-shicheng
  正濱漁港萬祝號咖啡看彩色屋:
  - zhengbin-fishing-port
  朱銘美術館「恆形」新展:
  - juming-museum
checklist:
- 飯店｜示容大飯店福隆 9/24(四) 一晚、一泊二食（含晚餐＋早餐）；退房最晚 11:00、入住 15:00（可先寄行李）。
- 沙灘封鎖｜福隆海水浴場沙灘經飯店告知封鎖、不可下水，沙灘活動全取消，館內海洋溫泉/SPA 不受影響。
- 萬祝號｜11:00 開、每週二三公休（9/24 週四營業）；停「正濱漁港停車場」（舊漁會大樓旁計次 30 元、06:00–23:30），步行到萬祝號與彩色屋。
- 灆咖啡（石城店）｜旺季 4/1–9/30 延長 09:00–18:30、末單 17:30，雙週二公休（9/24 週四營業）；9/24 平日午後人少。
- 鼻頭角步道｜海崖稜線、有坡，防曬防風；日落約 17:57、留意天黑前下山（想輕鬆改龍洞灣看海蝕地景）。
- 朱銘美術館｜10:00–17:00（16:00 停售）、週一休但逢國定假日照常（9/25 中秋開放）、全票 350；「恆形」特展 2026/5/9–12/20（室內＋戶外，9 月非草皮保養期）。逛累了服務中心旁美術館咖啡坊有咖啡/PIZZA/冰淇淋。
- 金山老街／小瑪克｜午餐去金山老街（金包里老街）走走，本店『小瑪克手工披薩』在中山路111號（老街入口旁、萬里瑪克的院子前身、北海岸第一家手披薩），吃得下就吃、吃不下逛老街買伴手。公休來源不一（週一或週三），電 02-2498-5858 確認、9/25 週五應開。註：朱銘館內「瑪克的院子」已於 2025/10/13 歇業，本店在金山老街仍營業。
- 亞尼克萬里創始店｜內用 10:00–22:00、新北市萬里區瑪鋉路 127-5 號；十勝生乳捲、備貨足。
- 颱風/海象｜行前 3–5 天查中央氣象署；海警/長浪則海岸步道全停、改室內（示容溫泉、九份金瓜石）。午後雷雨機率高、戶外排上午。
- 中秋回程（9/25）｜中秋當天回；早到金山、回程走萬里接台62/國3/國1、避開台2淡水海線午後回堵與國5雪隧；國道疏運以「高速公路1968」App 核對當日管制。
- 費用｜全程約 NT$12,400（住宿一泊二食 7,500＋自駕 1,200＋朱銘門票 700＋餐飲雜支 3,000；估算非報價，as_of 2026-09-23）。
days:
- date: '2026-09-24'
  label: 週四·出發地出發 → 基隆正濱萬祝號咖啡 → 東北角海岸南下 → 灆咖啡龜山島 → 示容福隆一泊二食
  lodging: hotel-d1
  rows:
  - time: '10:00'
    slot: move
    from: 出發地
    to: 基隆正濱漁港
    text: 自駕約 40 分（國道1號北上往基隆），停正濱漁港停車場（舊漁會大樓旁、計次 30 元）。
  - time: '10:45'
    slot: meal
    poi_id: zhengbin-fishing-port
    text: 正濱漁港彩色屋（台版彩色威尼斯）＋阿根納造船廠遺構散步拍照；11:00 進對面老屋咖啡「萬祝號」brunch，海港城市風、看漁港。
    closing_status: ok
  - time: '12:30'
    slot: activity
    poi_id: bitou-cape-trail
    text: 沿台2濱海南下兜風，停鼻頭角稜谷步道，海崖稜線、太平洋全景與鼻頭角燈塔（有坡、防曬防風）。想輕鬆可改龍洞灣看海蝕地景。
    closing_status: ok
  - time: '14:30'
    slot: meal
    poi_id: lan-coffee-shicheng
    text: 灆咖啡石城店，海上玻璃屋、180 度正對龜山島，吹冷氣、吃點心、看海放空（平日午後人少）。這是你指定必訪的一站。
    closing_status: ok
  - time: '15:45'
    slot: move
    from: 石城
    to: 示容大飯店福隆
    text: 北返約 15 分回福隆。
  - time: '16:00'
    slot: activity
    poi_id: hotel-d1-hotspring
    text: check-in，泡「海洋溫泉」（本島唯一氯化物氫鹽泉、日本溫泉協會認證，室內百坪大浴場＋SPA）；沙灘封鎖故不下水，館內泡湯放鬆。
    closing_status: ok
  - time: '18:30'
    slot: meal
    text: 飯店一泊二食晚餐（田園西餐廳）。
- date: '2026-09-25'
  label: 週五·中秋｜飯店早餐 → 朱銘恆形展 → 金山老街小瑪克披薩 → 萬里亞尼克 → 全程國道返出發地
  rows:
  - time: 08:00
    slot: meal
    text: 飯店早餐（一泊二食含）＋泡個晨湯。
  - time: '11:00'
    slot: move
    from: 示容大飯店福隆
    to: 金山朱銘美術館
    text: 退房（最晚 11:00），走台2 北海岸東段西行往金山約 65 分（從東邊進金山、避開淡水段午後回堵）。
  - time: '12:15'
    slot: visit
    poi_id: juming-museum
    text: 朱銘美術館「恆形」特展，拓樸學視野的雕塑，室內展覽室＋戶外雕塑園區（逛約 1.5–2 小時；16:00 停止售票）。逛累了服務中心旁美術館咖啡坊有咖啡/PIZZA/冰淇淋。
    closing_status: ok
  - time: '14:00'
    slot: visit
    poi_id: jinshan-old-street
    text: 金山老街（金包里老街）散步，300 年老街，鴨肉/芋圓/卜肉/蚵仔酥、買伴手。
    closing_status: ok
  - time: '14:20'
    slot: meal
    poi_id: xiaomake-pizza
    text: 小瑪克手工披薩本店（中山路111號、老街入口旁；萬里瑪克的院子前身、北海岸第一家手工披薩），吃得下就吃披薩/炸雞，吃不下就隨便逛老街。公休來源不一（週一或週三），電 02-2498-5858 確認，9/25 週五應開。
    closing_status: ok
  - time: '15:15'
    slot: move
    from: 金山
    to: 萬里亞尼克創始店
    text: 台2 東行約 15–20 分到萬里。
  - time: '15:35'
    slot: meal
    poi_id: yannick-wanli
    text: 亞尼克萬里創始店，十勝生乳捲，內用座位吃個下午茶、買伴手；創始店備貨足。
    closing_status: ok
  - time: '16:15'
    slot: move
    from: 萬里
    to: 出發地
    text: 萬里接台62萬瑞快速→國道3號→國道1號南下回出發地約 50 分（全程國道、避台2淡水海線午後回堵）。
